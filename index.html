function compact(v){var n=num(v);return n>=1e6?(n/1e6).toFixed(1)+" млн":n>=1e3?Math.round(n/1e3)+" тыс":String(Math.round(n));}
function short(s,n){s=String(s==null?"":s);return s.length>n?s.slice(0,n-1)+"…":s;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function pad(n){return String(n).padStart(2,"0");}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function today(){return iso(new Date());}
function offset(n){return iso(new Date(Date.now()+n*864e5));}
function dstr(v){if(!v)return "";var s=String(v);if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);

function uid(p,arr){var mx=0;arr.forEach(function(r){var m=String(r.id||"").match(/(\d+)$/);if(m)mx=Math.max(mx,parseInt(m[1],10));});
  return p+"-"+String(mx+1).padStart(4,"0");}
function rows(id){return DB[id]||[];}
function find(id,rid){var a=rows(id);for(var i=0;i<a.length;i++)if(String(a[i].id)===String(rid))return a[i];return null;}
function label(mod,rid){
  var m=M[mod];if(!m||!rid)return rid||"";
  var r=find(mod,rid);return r?(r[m.tK]||rid):rid;
}

var NOTIF=[];
function buildNotif(){
  var out=[],th=prefs().dash.threshold;
  function push(kind,mod,id,title,sub,d){out.push({key:mod+":"+id+":"+kind,kind:kind,mod:mod,id:id,title:title,sub:sub,days:d});}
  rows("prescriptions").forEach(function(p){var d=daysLeft(p.due);
    if(p.status!=="Исполнено"&&d!==null&&d<=th)push(d<0?"late":"soon","prescriptions",p.id,"Предписание "+p.number,p.type,d);});
  rows("supervision").forEach(function(p){var d=daysLeft(p.due);
    if(p.state!=="Устранено"&&d!==null&&d<=th)push(d<0?"late":"soon","supervision",p.id,"Авторский надзор",short(p.body,44),d);});
  rows("certs").forEach(function(c){var d=daysLeft(c.expiry);
    if(d!==null&&d<=30&&c.status!=="Отозван")push(d<0?"late":"soon","certs",c.id,c.type,label("personnel",c.person),d);});
  rows("reminders").forEach(function(r){var d=daysLeft(r.date);
    if(r.status!=="Выполнено"&&d!==null&&d<=th)push(d<0?"late":"soon","reminders",r.id,r.type,short(r.object,42),d);});
  rows("tasks").forEach(function(t){var d=daysLeft(t.deadline);
    if(["Выполнено","Отклонено"].indexOf(t.status)<0&&d!==null&&d<=th)push(d<0?"late":"soon","tasks",t.id,short(t.subject,42),t.to,d);});
  rows("submissions").forEach(function(s){if(s.status==="На_проверке")
    push("review","submissions",s.id,"Подача "+s.id,label("items",s.item)+" · "+s.volume+" "+(find("items",s.item)||{}).unit,null);});
  rows("docs").forEach(function(x){if(x.approval==="Замечания")
    push("remark","docs",x.id,x.type+" №"+(x.number||"—"),short(x.name,42),null);});
  rows("materials").forEach(function(x){var d=daysLeft(x.certExpiry);
    if(d!==null&&d<=th)push(d<0?"late":"soon","materials",x.id,"Сертификат: "+short(x.name,30),x.supplier,d);});
  rows("preservation").forEach(function(p){if(/Аварийное|Утрачено/.test(p.condition))
    push("remark","preservation",p.id,"Охрана: "+short(p.name,34),p.condition,null);});
  var rank={late:0,review:1,remark:2,soon:3};
  out.sort(function(a,b){return (rank[a.kind]-rank[b.kind])||((a.days==null?999:a.days)-(b.days==null?999:b.days));});
  NOTIF=out;
}
function unread(){return NOTIF.filter(function(n){return !DB.read[n.key];}).length;}
function paintNotif(){
  var b=$("#nBadge"),n=unread();
  if(b){b.textContent=n>99?"99+":(n||"");b.classList.toggle("show",n>0);}
  var bell=$("#bell");if(bell)bell.classList.toggle("ring",NOTIF.some(function(x){return x.kind==="late"&&!DB.read[x.key];}));
}
var Notif={
  open:function(){S.notifOpen=true;buildNotif();$("#notif").classList.add("on");$("#scrim").classList.add("on");
    document.body.classList.add("lock");Notif.render();},
  close:function(){S.notifOpen=false;$("#notif").classList.remove("on");$("#scrim").classList.remove("on");unlock();},
  render:function(){
    var gs=[["late","Просрочено","bad"],["review","Ждут проверки","warn"],["remark","Замечания и охрана","bad"],["soon","Близкие сроки","warn"]];
    var html="";
    if(!NOTIF.length)html='<div class="empty"><div class="empty-i">✅</div><h3>Всё под контролем</h3><p>Просрочек, замечаний и близких сроков не найдено.</p></div>';
    gs.forEach(function(g){
      var list=NOTIF.filter(function(n){return n.kind===g[0];});if(!list.length)return;
      html+='<div class="ntg"><div class="nth"><span class="chip '+g[2]+'">'+g[1]+'</span><em>'+list.length+'</em>'+
        '<button class="btn ghost sm" onclick="Notif.markGroup(\''+g[0]+'\')">Прочитано</button></div>';
      list.forEach(function(n){
        var m=M[n.mod]||{i:"📄"};
        html+='<button class="nti'+(DB.read[n.key]?" read":"")+'" onclick="Notif.jump(\''+n.mod+'\',\''+esc(n.id)+'\',\''+n.key+'\')">'+
          '<span class="nti-i">'+m.i+'</span><span class="nti-t"><b>'+esc(n.title)+'</b><i>'+esc(n.sub||"")+'</i></span>'+
          (n.days!=null?'<span class="ntd '+(n.days<0?"late":"soon")+'">'+(n.days<0?"−"+Math.abs(n.days):"+"+n.days)+' дн</span>':"")+

  markAll:function(){NOTIF.forEach(function(n){DB.read[n.key]=1;});save();Notif.render();paintNotif();toast("Все уведомления отмечены","ok");},
  jump:function(mod,id,key){DB.read[key]=1;save();paintNotif();Notif.close();go(mod);setTimeout(function(){Drawer.open(mod,id);},80);}
};

function fname(m,c){
  var f=(m.f||[]).filter(function(x){return x.k===c;})[0];
  return f?f.l:c;
}
function selectRows(m){
  var a=rows(m.id).slice(),q=(S.q[m.id]||"").trim().toLowerCase(),f=S.filter[m.id]||"",s=S.sort[m.id];
  if(q)a=a.filter(function(r){
    for(var k in r){if(k==="id")continue;if(String(r[k]).toLowerCase().indexOf(q)>-1)return true;}
    return String(r.id).toLowerCase().indexOf(q)>-1;});
  if(f&&m.sK)a=a.filter(function(r){return String(r[m.sK])===f;});
  if(s&&s.col){
    var dir=s.dir==="asc"?1:-1;
    a.sort(function(x,y){
      var A=x[s.col],B=y[s.col],na=parseFloat(A),nb=parseFloat(B);
      if(!isNaN(na)&&!isNaN(nb)&&String(A).trim()!==""&&String(B).trim()!=="")return (na-nb)*dir;
      return String(A==null?"":A).localeCompare(String(B==null?"":B),"ru")*dir;});
  }
  return a;
}
function kind(v){
  var s=String(v||"");
  if(/Согласован|Подтверждено|Выполнено|Закрыто|Победа|Принято|Оплачена|Доставлено|Активен|Действует|Работает|Исполнено|Утвержд|Сдан|Проведена|Устранено|Отличное|Удовлетвор|^Да$/.test(s))return "ok";
  if(/проверке|разработке|согласовании|рассмотрении|работе|пути|Подана|Подано|Выдан|Заказан|Ожидает|Новое|Отпуск|Подготовка|Мониторинг|Активно|Истекает|Требует/.test(s))return "warn";
  if(/Замечания|Отклонен|Отказ|Просрочен|Утерян|Выговор|Уволен|Отмен|Аварийное|Утрачено|Не_устранено|Отозван/.test(s))return "bad";
  return "neutral";
}
function cellHtml(m,c,r){
  var v=r[c];
  if(c===m.sK)return '<span class="chip '+kind(v)+'">'+esc(v||"—")+"</span>";
  if(c==="kgiop")return v==="Да"?'<span class="chip ok">Да</span>':'<span class="chip neutral">Нет</span>';
  if(c===m.money||/^(sum|closedSum|price|our|start)$/.test(c))
    return '<b class="num">'+(v!==""&&v!=null?money(v):"—")+"</b>";
  if(/^(date|created|issued|hired|sent|start|end|delivery|publish|submit|answered|expiry|due|deadline|certExpiry)$/.test(c)){
    var d=daysLeft(v);
    if(m.deadline===c&&d!==null&&d<=prefs().dash.threshold&&!/Выполнено|Исполнено|Устранено|Закрыто/.test(String(r[m.sK])))
      return '<span class="dt '+(d<0?"late":"soon")+'">'+esc(dstr(v))+" <i>"+(d<0?Math.abs(d)+" дн. назад":d+" дн.")+"</i></span>";
    return '<span class="dt">'+esc(dstr(v)||"—")+"</span>";
  }
  if(REFK[c])return '<span class="ref">'+esc(short(label(REFK[c],v),26)||"—")+"</span>";
  if(c==="to")return '<span class="ref">'+esc(short(v,22)||"—")+"</span>";
  if(c==="priority")return '<span class="chip '+(/Срочный/.test(v)?"bad":/Высокий/.test(v)?"warn":"neutral")+'">'+esc(v||"—")+"</span>";
  if(c==="closed"){
    var t=num(r.qty),dd=num(v),p=t?Math.min(100,Math.round(dd/t*100)):0;
    return '<div class="mini"><div class="mini-b"><i style="width:'+p+'%"></i></div><span>'+dd+"/"+t+"</span></div>";
  }
  if(m.avatar===c)return '<div class="who"><span class="ava">'+esc(initials(v))+"</span><b>"+esc(v||"—")+"</b></div>";
  return esc(short(v,60)||"—");

      '<th class="c-id">ID</th>'+cols.map(function(c){
        return '<th class="s'+(((S.sort[m.id]||{}).col===c)?" act":"")+'" data-a="sort" data-col="'+esc(c)+'">'+
          esc(fname(m,c))+(((S.sort[m.id]||{}).col===c)?(((S.sort[m.id]||{}).dir==="asc")?" ↑":" ↓"):"")+"</th>";}).join("")+
      '<th class="c-a"></th></tr></thead><tbody>'+
      slice.map(function(r,i){
        var id=r.id,on=S.sel.has(String(id));
        return '<tr class="'+(on?"sel":"")+(i===S.focus?" foc":"")+'" data-id="'+esc(id)+'" data-i="'+i+'"'+(drag?' draggable="true"':"")+">"+
          (drag?'<td class="c-dh"><span class="dh">⠿</span></td>':"")+
          '<td class="c-cb"><label class="cb"><input type="checkbox" data-a="sel" data-id="'+esc(id)+'"'+(on?" checked":"")+'><i></i></label></td>'+
          '<td class="c-id"><button class="idb" data-a="open" data-id="'+esc(id)+'">'+esc(id)+"</button></td>"+
          cols.map(function(c){return "<td>"+cellHtml(m,c,r)+"</td>";}).join("")+
          '<td class="c-a"><div class="acts">'+
          '<button class="btn ghost sm" data-a="open" data-id="'+esc(id)+'">👁</button>'+
          '<button class="btn ghost sm" data-a="edit" data-id="'+esc(id)+'">✎</button>'+
          '<button class="btn danger sm" data-a="del" data-id="'+esc(id)+'">🗑</button>'+
          "</div></td></tr>";
      }).join("")+"</tbody></table></div>"+
      '<div class="kb-hint">↑↓ строка · Enter карточка · E правка · Space выбор · Del удалить</div>';
  }
  if(all.length>lim)html+='<div class="more"><button class="btn ghost" data-a="more">Показать ещё '+
    Math.min(40,all.length-lim)+" из "+(all.length-lim)+"</button></div>";
  host.innerHTML=html;
  host.onclick=function(e){bodyClick(e,m);};
  if(drag){
    host.ondragstart=function(e){var tr=e.target.closest("tr[data-id]");if(!tr)return;
      S.drag=tr.dataset.id;tr.classList.add("src");e.dataTransfer.effectAllowed="move";
      try{e.dataTransfer.setData("text/plain",S.drag);}catch(x){}};
    host.ondragover=function(e){if(!S.drag)return;e.preventDefault();
      var tr=e.target.closest("tr[data-id]");if(!tr||tr.dataset.id===S.drag)return;
      $$("tr.over").forEach(function(x){x.classList.remove("over");});tr.classList.add("over");};
    host.ondragend=function(){S.drag=null;$$(".src,.over").forEach(function(x){x.classList.remove("src","over");});};
    host.ondrop=function(e){dropRow(e,m);};

function resetF(){var m=M[S.mod];S.q[m.id]="";S.filter[m.id]="";S.page[m.id]=1;toolbar(m);list(m);}
function bodyClick(e,m){
  var t=e.target.closest("[data-a]");if(!t)return;
  var a=t.dataset.a,id=t.dataset.id;
  if(a==="more"){S.page[m.id]=(S.page[m.id]||1)+1;list(m);return;}
  if(a==="sort"){var c=t.dataset.col,s=S.sort[m.id]||{};
    S.sort[m.id]={col:c,dir:s.col===c&&s.dir==="desc"?"asc":"desc"};toolbar(m);list(m);return;}
  if(a==="sel"){
    var all=selectRows(m).slice(0,(S.page[m.id]||1)*40);
    var idx=-1;for(var i=0;i<all.length;i++)if(String(all[i].id)===String(id)){idx=i;break;}
    if(e.shiftKey&&S.lastSel>-1){var a1=Math.min(S.lastSel,idx),b1=Math.max(S.lastSel,idx);
      for(var j=a1;j<=b1;j++)S.sel.add(String(all[j].id));}
    else{if(S.sel.has(String(id)))S.sel.delete(String(id));else S.sel.add(String(id));}
    S.lastSel=idx;S.focus=idx;bulkBar(m);list(m);return;}
  if(a==="selall"){
    var all2=selectRows(m).slice(0,(S.page[m.id]||1)*40);
    var on=all2.every(function(r){return S.sel.has(String(r.id));});
    all2.forEach(function(r){if(on)S.sel.delete(String(r.id));else S.sel.add(String(r.id));});
    bulkBar(m);list(m);return;}
  if(a==="open"){Drawer.open(m.id,id);return;}
  if(a==="edit"){Form.open(m.id,id);return;}
  if(a==="del"){if(confirm("Удалить "+id+"? Запись попадёт в корзину."))del(m.id,[id]);}
}
function dropRow(e,m){
  if(!S.drag)return;e.preventDefault();
  var tr=e.target.closest("tr[data-id]"),from=S.drag;
  S.drag=null;$$(".src,.over").forEach(function(x){x.classList.remove("src","over");});
  if(!tr||tr.dataset.id===from)return;
  var all=selectRows(m),fi=-1,ti=-1;
  all.forEach(function(r,i){if(String(r.id)===String(from))fi=i;if(String(r.id)===String(tr.dataset.id))ti=i;});
  if(fi<0||ti<0)return;
  var moved=all.splice(fi,1)[0];all.splice(ti,0,moved);
  all.forEach(function(r,i){r[m.orderK]=i+1;});
  save();list(m);toast("Порядок сохранён","ok");log("Изменение порядка",m.t,"позиций: "+all.length);
}
function bulkBar(m){
  var n=S.sel.size,bar=$("#bulk");if(!bar)return;
  if(!n){bar.innerHTML="";bar.classList.remove("on");return;}
  bar.classList.add("on");
  var h="<b>"+n+"</b> выбрано"+'<button class="btn danger sm" id="bDel">🗑 Удалить</button>';
  if(m.sK)h+='<select id="bStat" class="tb-sel"><option value="">Статус…</option>'+
    m.st.map(function(s){return "<option>"+esc(s)+"</option>";}).join("")+"</select>"+
    '<button class="btn ghost sm" id="bStatGo">Применить</button>';
  h+='<button class="btn ghost sm" id="bClear">Снять</button>';
  bar.innerHTML=h;
  $("#bDel").onclick=function(){if(confirm("Удалить "+n+" записей?"))del(m.id,Array.from(S.sel));};
  $("#bClear").onclick=function(){S.sel.clear();bulkBar(m);list(m);};
  if($("#bStatGo"))$("#bStatGo").onclick=function(){
    var v=$("#bStat").value;if(!v){toast("Выберите статус","warn");return;}
    var ids=Array.from(S.sel);
    ids.forEach(function(id){var r=find(m.id,id);if(r)r[m.sK]=v;});
    save();buildNotif();paintNotif();S.sel.clear();bulkBar(m);list(m);
    log("Массовая смена статуса",m.t,ids.length+" → "+v);
    toast("Статус обновлён: "+ids.length,"ok");};
}
function del(mod,ids){
  var m=M[mod],moved=[];
  DB[mod]=rows(mod).filter(function(r){
    if(ids.map(String).indexOf(String(r.id))>-1){moved.push(r);return false;}return true;});
  DB.trash[mod]=(DB.trash[mod]||[]).concat(moved.map(function(r){
    return {id:r.id,title:String(r[m.tK]||r.id),data:r};}));
  S.sel.clear();save();buildNotif();paintNotif();
  if(M[S.mod]&&!M[S.mod].special){bulkBar(M[S.mod]);list(M[S.mod]);}else render();
  paintBadges();
  log("Удаление в корзину",m.t,ids.join(", "));
  toast(m.t+": удалено "+ids.length,"warn","Отменить",function(){
    DB.trash[mod]=(DB.trash[mod]||[]).filter(function(t){return ids.map(String).indexOf(String(t.id))<0;});
    moved.forEach(function(r){DB[mod].push(r);});
    save();buildNotif();paintNotif();render();toast("Восстановлено: "+ids.length,"ok");
    log("Восстановление",m.t,ids.join(", "));});
}

var Form={
  ctx:null,
  open:function(mod,id){
    var m=M[mod];if(!m||!m.f)return;
    var rec=id?find(mod,id):null;
    Form.ctx={mod:mod,id:id||null};
    $("#mTitle").innerHTML=(rec?"✎ ":"＋ ")+esc(m.t)+(rec?" · "+esc(id):"");
    var h='<form class="form" onsubmit="return false">'+m.f.map(function(f){return fieldHtml(m,f,rec);}).join("");
    if(m.calc)h+='<div class="note">Сумма считается автоматически: количество × цена.</div>';
    h+="</form>";
    $("#mBody").innerHTML=h;
    $("#mFoot").innerHTML='<button class="btn ghost" onclick="Form.close()">Отмена</button>'+
      '<button class="btn primary" id="fSave">'+(rec?"Сохранить изменения":"Создать запись")+"</button>";
    $("#fSave").onclick=Form.submit;
    $("#modal").classList.add("on");document.body.classList.add("lock");
    if(m.calc){
      var a=$("#f_"+m.calc[0]),b=$("#f_"+m.calc[1]);
      var upd=function(){var s=num(a.value)*num(b.value);var n=$(".note");
        if(n)n.textContent="Сумма: "+money(s)+" ("+num(a.value)+" × "+num(b.value)+")";};
      if(a&&b){a.oninput=upd;b.oninput=upd;upd();}
    }
    setTimeout(function(){var el=$("#mBody input, #mBody select, #mBody textarea");if(el)el.focus();},60);
  },
  close:function(){$("#modal").classList.remove("on");unlock();Form.ctx=null;},
  submit:function(){
    if(!Form.ctx)return;
    var m=M[Form.ctx.mod],vals={};
    for(var i=0;i<m.f.length;i++){
      var f=m.f[i],el=$("#f_"+f.k);if(!el)continue;
      var v=el.value;
      if(f.t==="number")v=v===""?"":num(v);
      if(f.req&&(v===""||v==null)){el.classList.add("bad");el.focus();toast("Заполните «"+f.l+"»","warn");return;}
      el.classList.remove("bad");vals[f.k]=v;
    }
    if(m.calc){var A=num(vals[m.calc[0]]),B=num(vals[m.calc[1]]);if(A&&B)vals.sum=A*B;}
    if(Form.ctx.id){
      var r=find(Form.ctx.mod,Form.ctx.id);
      if(!r){toast("Запись не найдена","bad");Form.close();return;}
      Object.keys(vals).forEach(function(k){r[k]=vals[k];});
      if(m.id==="works")r.closedSum=num(r.closed)*num(r.price);
      if(m.id==="supervision"&&vals.state==="Устранено")r.fixedAt=today();
      if(m.id==="prescriptions"&&vals.status==="Исполнено")r.doneAt=today();
      log("Изменение",m.t,Form.ctx.id);
      toast("Изменения сохранены","ok");
    }else{
      var pref={contracts:"ДОГ",estimates:"СМ",items:"ПОЗ",submissions:"ПДВ",ks2:"КС2",ks2items:"КПЗ",
        docs:"ДОК",architecture:"АРХ",preservation:"ПРХ",prescriptions:"ПРДП",supervision:"АН",approvals:"СГЛ",
        ppr:"ППР",daily:"ЕО",personnel:"ПРС",certs:"ДПР",orders:"ПРК",contractors:"ПРД",works:"РПР",
        payments:"ВПЛ",tasks:"ЗДЧ",materials:"МАТ",reminders:"НАП",additional:"ДР",kp:"КП",tenders:"ТНД"}[m.id]||"ЗАП";
      var nid=uid(pref,rows(m.id));
      vals.id=nid;
      if(m.sK&&!vals[m.sK])vals[m.sK]=m.st[0];
      if(m.dateK&&!vals[m.dateK])vals[m.dateK]=today();
      if(m.orderK)vals[m.orderK]=rows(m.id).length+1;
      if(m.id==="items")vals.closed=num(vals.closed);
      if(m.id==="works"){vals.closed=num(vals.closed);vals.closedSum=vals.closed*num(vals.price);}
      if(m.id==="tasks"){vals.progress=num(vals.progress);vals.created=today();}
      if(m.id==="submissions"){vals.by="Орлов К.И.";vals.approved="";vals.reviewer="";vals.reviewAt="";vals.reviewNote="";}
      DB[m.id].push(vals);
      if(m.id==="supervision"&&vals.executor){
        DB.tasks.push({id:uid("ЗДЧ",DB.tasks),subject:"Авторский надзор: "+short(vals.body,50),to:vals.executor,
          deadline:vals.due||"",priority:"Высокий",contract:"",progress:0,status:"Новое",created:today(),body:vals.body});
        toast("Создано задание исполнителю","ok");
      }
      log("Создание",m.t,nid);
      toast("Создано: "+nid,"ok");
      Form.ctx.newId=nid;
    }
    var opened=Form.ctx.id||Form.ctx.newId;
    save();buildNotif();paintNotif();Form.close();render();
    if(opened&&M[S.mod]&&M[S.mod].id===m.id)Drawer.open(m.id,opened);
  }
};
function fieldHtml(m,f,rec){
  var id="f_"+f.k,v=rec?rec[f.k]:"";
  var req=f.req?' <em>*</em>':"";
  var opts=f.opts||(f.k===m.sK?m.st:null);
  var inp;
  if(f.t==="textarea")inp='<textarea id="'+id+'" rows="3">'+esc(v==null?"":v)+"</textarea>";
  else if(f.t==="select"&&opts)inp='<select id="'+id+'"><option value="">—</option>'+
    opts.map(function(o){return "<option"+(String(v)===String(o)?" selected":"")+">"+esc(o)+"</option>";}).join("")+"</select>";
  else if(f.t==="ref"){
    var arr=rows(f.ref);
    inp='<select id="'+id+'"><option value="">— не выбрано —</option>'+arr.map(function(r){
      return '<option value="'+esc(r.id)+'"'+(String(v)===String(r.id)?" selected":"")+">"+
        esc(short(r[f.refLabel]||r.id,54))+" · "+esc(r.id)+"</option>";}).join("")+"</select>";
  }
  else if(f.t==="date")inp='<input id="'+id+'" type="date" value="'+esc(dstr(v))+'">';
  else if(f.t==="number")inp='<input id="'+id+'" type="number" step="any" value="'+esc(v===""||v==null?"":num(v))+'">';
  else inp='<input id="'+id+'" type="'+(f.t==="email"?"email":"text")+'" value="'+esc(v==null?"":v)+'">';
  return '<div class="fg'+(f.wide?" wide":"")+'"><label for="'+id+'">'+esc(f.l)+req+"</label>"+inp+"</div>";
}

function msgHtml(c){
  return '<div class="msg"><b>'+esc(c.who)+"</b><i>"+esc(c.at)+"</i><p>"+esc(c.text)+"</p></div>";
}
function addMsg(mod,id,kind,taId){
  var el=$("#"+taId),t=el?el.value.trim():"";
  if(!t){toast("Введите текст","warn");return;}
  DB.comments.push({mod:mod,rec:id,kind:kind,who:"Орлов К.И.",at:new Date().toLocaleString("ru-RU"),text:t});
  if(kind==="reply"){var r=find(mod,id);if(r&&r.status==="Новое")r.status="В работе";}
  save();log(kind==="reply"?"Ответ на задание":"Комментарий",M[mod].t,id);

function review(id,status){
  var s=find("submissions",id);
  if(!s){toast("Подача не найдена","bad");return;}
  if(s.status!=="На_проверке"){toast("Подача уже обработана — повторное закрытие невозможно","warn");return;}
  var vol=num($("#revVol").value),note=$("#revNote").value.trim();
  if(status==="Отклонено"&&!note){toast("Укажите причину отказа","warn");$("#revNote").focus();return;}
  var approved=status==="Отклонено"?0:(vol||num(s.volume));
  if(approved<0){toast("Объём не может быть отрицательным","warn");return;}
  s.status=status;s.approved=approved;s.reviewer="Орлов К.И.";
  s.reviewAt=new Date().toLocaleString("ru-RU");s.reviewNote=note;
  var capped=false;
  if(approved>0){
    var it=find("items",s.item);
    if(it){
      var total=num(it.qty),before=num(it.closed),next=before+approved;
      if(next>total){next=total;capped=true;}
      it.closed=next;
      it.status=next>=total?"Закрыто":(next>0?"В работе":"Не начато");
    }
  }
  save();buildNotif();paintNotif();Drawer.close();render();
  log("Проверка подачи",id,status+" · зачтено "+approved);
  toast("Подача "+status.toLowerCase()+" · зачтено "+approved+(capped?" (ограничено объёмом сметы)":""),capped?"warn":"ok");
}

var Pal={
  open:function(){S.palOpen=true;S.palIdx=0;$("#pal").classList.add("on");document.body.classList.add("lock");
    var i=$("#pInput");i.value="";Pal.search("");i.focus();},
  close:function(){S.palOpen=false;$("#pal").classList.remove("on");unlock();},
  search:function(q){
    q=String(q||"").trim().toLowerCase();
    var items=[];
    MODS.forEach(function(m){
      if(!q||m.t.toLowerCase().indexOf(q)>-1)
        items.push({g:"Раздел",i:m.i,title:m.t,sub:m.special?"аналитика":rows(m.id).length+" записей",
          run:function(){Pal.close();go(m.id);}});
    });
    if(q)MODS.filter(function(m){return !m.special;}).forEach(function(m){
      if(("создать "+m.t).toLowerCase().indexOf(q)>-1)
        items.push({g:"Действие",i:"＋",title:"Создать · "+m.t,sub:"новая запись",
          run:function(){Pal.close();go(m.id);Form.open(m.id,null);}});
    });
    if(q.length>=2){
      var count=0;
      MODS.filter(function(m){return !m.special;}).forEach(function(m){
        if(count>=36)return;
        rows(m.id).forEach(function(r){
          if(count>=36)return;
          var hit=String(r.id).toLowerCase().indexOf(q)>-1;
          if(!hit)for(var k in r){if(String(r[k]).toLowerCase().indexOf(q)>-1){hit=true;break;}}
          if(hit){count++;
            items.push({g:m.t,i:m.i,title:String(r[m.tK]||r.id),
              sub:r.id+(r[m.sK]?" · "+r[m.sK]:""),
              run:function(){Pal.close();go(m.id);setTimeout(function(){Drawer.open(m.id,r.id);},70);}});}
        });
      });
    }
    items.push({g:"Команда",i:"🔔",title:"Сроки и замечания",sub:unread()+" непрочитанных",
      run:function(){Pal.close();Notif.open();}});
    items.push({g:"Команда",i:"🌓",title:"Переключить тему",sub:"светлая / тёмная",run:function(){toggleTheme();}});
    items.push({g:"Команда",i:"🖨",title:"Печать текущего реестра",sub:"откроется окно печати",
      run:function(){Pal.close();printReg();}});
    items.push({g:"Команда",i:"⤓",title:"Выгрузить CSV",sub:"текущий раздел",run:function(){Pal.close();exportCsv();}});
    S.palItems=items.slice(0,60);Pal.paint(q);
  },
  paint:function(q){
    var host=$("#pr");
    if(!S.palItems.length){host.innerHTML='<div class="pe">Ничего не найдено. Попробуйте номер договора, ФИО, тип документа или название раздела.</div>';return;}
    var last="",h="";
    S.palItems.forEach(function(it,i){
      if(it.g!==last){h+='<div class="pg">'+esc(it.g)+"</div>";last=it.g;}
      h+='<button class="pi'+(i===S.palIdx?" on":"")+'" data-i="'+i+'"><span class="pi-i">'+it.i+"</span>"+
        '<span class="pi-t"><b>'+hl(it.title,q)+"</b><i>"+hl(it.sub,q)+"</i></span><em>↵</em></button>";
    });
    host.innerHTML=h;
    $$(".pi",host).forEach(function(b){
      b.onmouseenter=function(){S.palIdx=+b.dataset.i;
        $$(".pi").forEach(function(x){x.classList.toggle("on",+x.dataset.i===S.palIdx);});};
      b.onclick=function(){S.palItems[+b.dataset.i].run();};
    });
    var on=$(".pi.on",host);if(on)on.scrollIntoView({block:"nearest"});
  },
  key:function(e){
    if(!S.palOpen)return;
    var q=$("#pInput").value.trim().toLowerCase();
    if(e.key==="ArrowDown"){e.preventDefault();S.palIdx=clamp(S.palIdx+1,0,S.palItems.length-1);Pal.paint(q);}
    if(e.key==="ArrowUp"){e.preventDefault();S.palIdx=clamp(S.palIdx-1,0,S.palItems.length-1);Pal.paint(q);}
    if(e.key==="Enter"){e.preventDefault();var it=S.palItems[S.palIdx];if(it)it.run();}
  }
};

function dashData(){
  var d=prefs().dash;
  var cut=d.period==="all"?null:new Date(Date.now()-parseInt(d.period,10)*864e5);
  function inR(r,dk){
    if(!cut)return true;
    var s=dstr(r[dk]||r.date);if(!s)return true;
    var t=new Date(s+"T00:00:00");return isNaN(t)?true:t>=cut;
  }
  function byC(r){return !d.contract||String(r.contract||"")===String(d.contract);}
  var docs=rows("docs").filter(function(r){return inR(r,"date")&&byC(r);});
  var met=function(r){return d.metric==="sum"?num(r.sum):1;};
  function grp(arr,key){var o={};arr.forEach(function(r){var k=r[key]||"Другое";o[k]=(o[k]||0)+met(r);});return o;}
  var months={};
  docs.forEach(function(r){var s=dstr(r.date);if(!s)return;var k=s.slice(0,7);months[k]=(months[k]||0)+met(r);});
  var mk=Object.keys(months).sort().slice(-12);
  return {docs:docs,byCat:grp(docs,"cat"),byStatus:grp(docs,"approval"),
    trend:mk.map(function(k){return {label:k,value:months[k]};}),
    contracts:rows("contracts").filter(function(c){return !d.contract||String(c.id)===String(d.contract);}),
    subs:rows("submissions").filter(byC),ks2:rows("ks2").filter(byC)};
}

function chart(obj,tag){
  var d=prefs().dash,keys=Object.keys(obj),H=hues();
  if(!keys.length)return '<p class="dim">Нет данных в выбранном периоде.</p>';
  var total=keys.reduce(function(a,k){return a+obj[k];},0);
  var fmt=function(v){return d.metric==="sum"?compact(v):String(Math.round(v));};
  if(d.chart==="bars"){
    var mx=Math.max.apply(null,keys.map(function(k){return obj[k];}));
    var w=Math.max(320,keys.length*68),h=214,p=d.grid?28:10,g="";
    if(d.grid)for(var i=0;i<=4;i++){var y=p+(h-p*2)*i/4;
      g+='<line x1="'+p+'" y1="'+y+'" x2="'+(w-p)+'" y2="'+y+'" stroke="currentColor" stroke-opacity=".13"/>'+
         '<text x="3" y="'+(y+3)+'" class="ax">'+fmt(mx*(1-i/4))+"</text>";}
    var bw=(w-p*2)/keys.length;
    var bars=keys.map(function(k,i){
      var bh=Math.max(3,(obj[k]/mx)*(h-p*2)),x=p+i*bw+bw*0.18,y2=h-p-bh;
      return "<g><rect x='"+x+"' y='"+y2+"' width='"+(bw*0.64)+"' height='"+bh+"' rx='5' fill='url(#bg"+tag+i+")'"+
        (d.glow?" filter='url(#gl)'":"")+"><title>"+esc(k)+": "+fmt(obj[k])+"</title></rect>"+
        (d.labels?'<text x="'+(x+bw*0.32)+'" y="'+(y2-5)+'" text-anchor="middle" class="vl">'+fmt(obj[k])+"</text>":"")+
        '<text x="'+(x+bw*0.32)+'" y="'+(h-5)+'" text-anchor="middle" class="ax">'+esc(short(k,9))+"</text></g>";
    }).join("");
    var defs=keys.map(function(k,i){
      return '<linearGradient id="bg'+tag+i+'" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="'+H[i%8]+
        '"/><stop offset="1" stop-color="'+H[(i+2)%8]+'"/></linearGradient>';}).join("");
    return '<svg viewBox="0 0 '+w+" "+h+'" class="chart" data-c="'+tag+'"><defs>'+defs+glowDef()+"</defs>"+g+bars+"</svg>"+legend(keys,obj,fmt);
  }
  if(d.chart==="line"){
    var w2=470,h2=214,p2=d.grid?30:12;
    var mx2=Math.max.apply(null,keys.map(function(k){return obj[k];}))||1;
    var pts=keys.map(function(k,i){
      return [p2+(w2-p2*2)*(keys.length===1?0.5:i/(keys.length-1)),h2-p2-(obj[k]/mx2)*(h2-p2*2)];});
    var path=smooth(pts,d.curve/100),g2="";
    if(d.grid)for(var j=0;j<=4;j++){var yy=p2+(h2-p2*2)*j/4;
      g2+='<line x1="'+p2+'" y1="'+yy+'" x2="'+(w2-p2)+'" y2="'+yy+'" stroke="currentColor" stroke-opacity=".13"/>'+
          '<text x="3" y="'+(yy+3)+'" class="ax">'+fmt(mx2*(1-j/4))+"</text>";}
    return '<svg viewBox="0 0 '+w2+" "+h2+'" class="chart" data-c="'+tag+'"><defs>'+
      '<linearGradient id="ln'+tag+'" x1="0" x2="1"><stop offset="0" stop-color="'+H[0]+'"/><stop offset=".5" stop-color="'+H[1]+

      pts.map(function(pt,i){

          '<text x="'+pt[0]+'" y="'+(h2-5)+'" text-anchor="middle" class="ax">'+esc(short(keys[i],8))+"</text>";}).join("")+"</svg>";
  }
  var Rr=54,C=2*Math.PI*Rr,acc=0,segs="";
  keys.forEach(function(k,i){

    segs+='<circle r="'+Rr+'" cx="80" cy="80" fill="none" stroke="'+H[i%8]+'" stroke-width="'+d.thick+
      '" stroke-dasharray="'+len.toFixed(2)+" "+C.toFixed(2)+'" stroke-dashoffset="'+(-acc).toFixed(2)+
      '" transform="rotate(-90 80 80)"'+(d.glow?" filter='url(#gl)'":"")+"><title>"+esc(k)+": "+fmt(obj[k])+"</title></circle>";

function legend(keys,obj,fmt){
  var H=hues(),total=keys.reduce(function(a,k){return a+obj[k];},0)||1;
  return '<ul class="leg">'+keys.map(function(k,i){
    return "<li><i style='background:"+H[i%8]+"'></i><span>"+esc(k)+"</span><b>"+fmt(obj[k])+"</b><em>"+
      Math.round(obj[k]/total*100)+"%</em></li>";}).join("")+"</ul>";
}
function smooth(pts,t){
  if(!pts.length)return "";
  if(pts.length<3||t<=0)return "M "+pts.map(function(p){return p[0]+" "+p[1];}).join(" L ");
  var d="M "+pts[0][0]+" "+pts[0][1];
  for(var i=0;i<pts.length-1;i++){
    var p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    var c1x=p1[0]+(p2[0]-p0[0])/6*t*2,c1y=p1[1]+(p2[1]-p0[1])/6*t*2;
    var c2x=p2[0]-(p3[0]-p1[0])/6*t*2,c2y=p2[1]-(p3[1]-p1[1])/6*t*2;
    d+=" C "+c1x+" "+c1y+", "+c2x+" "+c2y+", "+p2[0]+" "+p2[1];
  }
  return d;
}
function trend(tr){
  var d=prefs().dash,H=hues();
  if(!tr.length)return '<p class="dim">Нет датированных документов в выбранном периоде.</p>';
  var w=900,h=234,p=d.grid?40:14;
  var mx=Math.max.apply(null,tr.map(function(t){return t.value;}))||1;
  var pts=tr.map(function(t,i){
    return [p+(w-p*2)*(tr.length===1?0.5:i/(tr.length-1)),h-p-(t.value/mx)*(h-p*2)];});
  var path=smooth(pts,d.curve/100);
  var fmt=function(v){return d.metric==="sum"?compact(v):String(Math.round(v));};
  var g="";
  if(d.grid)for(var i2=0;i2<=4;i2++){var y=p+(h-p*2)*i2/4;
    g+='<line x1="'+p+'" y1="'+y+'" x2="'+(w-p)+'" y2="'+y+'" stroke="currentColor" stroke-opacity=".13"/>'+
       '<text x="5" y="'+(y+4)+'" class="ax">'+fmt(mx*(1-i2/4))+"</text>";}
  return '<svg viewBox="0 0 '+w+" "+h+'" class="chart" data-c="trend"><defs>'+
    '<linearGradient id="tl" x1="0" x2="1"><stop offset="0" stop-color="'+H[0]+'"/><stop offset=".35" stop-color="'+H[3]+
    '"/><stop offset=".7" stop-color="'+H[2]+'"/><stop offset="1" stop-color="'+H[1]+'"/></linearGradient>'+
    '<linearGradient id="ta" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+H[1]+
    '" stop-opacity=".34"/><stop offset="1" stop-color="'+H[1]+'" stop-opacity="0"/></linearGradient>'+glowDef()+"</defs>"+g+
    '<path d="'+path+" L "+(w-p)+" "+(h-p)+" L "+p+" "+(h-p)+' Z" fill="url(#ta)"/>'+
    '<path d="'+path+'" fill="none" stroke="url(#tl)" stroke-width="'+(d.thick/4+2.5)+
    '" stroke-linecap="round" stroke-linejoin="round"'+(d.glow?" filter='url(#gl)'":"")+"/>"+
    pts.map(function(pt,i){
      return '<g><circle cx="'+pt[0]+'" cy="'+pt[1]+'" r="5" fill="'+H[i%8]+
        '" stroke="var(--surface)" stroke-width="2"><title>'+tr[i].label+": "+fmt(tr[i].value)+"</title></circle>"+
        (d.labels?'<text x="'+pt[0]+'" y="'+(pt[1]-11)+'" text-anchor="middle" class="vl">'+fmt(tr[i].value)+"</text>":"")+
        '<text x="'+pt[0]+'" y="'+(h-7)+'" text-anchor="middle" class="ax">'+esc(tr[i].label)+"</text></g>";}).join("")+"</svg>";
}
function chartPng(){
  var svg=$('[data-c="trend"]')||$('[data-c="a"]');
  if(!svg){toast("Нет графика для экспорта","warn");return;}
  try{
    var cs=getComputedStyle(document.documentElement);
    var txt=cs.getPropertyValue("--txt").trim()||"#101a27";
    var txt3=cs.getPropertyValue("--txt3").trim()||"#7690a8";
    var surf=cs.getPropertyValue("--surface").trim()||"#ffffff";
    var clone=svg.cloneNode(true);
    clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
    $$(".ax,.vl,.dn,.dsub",clone).forEach(function(t){
      t.setAttribute("fill",t.classList.contains("vl")||t.classList.contains("dn")?txt:txt3);
      t.setAttribute("font-family","Arial, sans-serif");
      t.setAttribute("font-size",t.classList.contains("dn")?"21":"10");
    });
    $$('[stroke="currentColor"]',clone).forEach(function(l){l.setAttribute("stroke","#94a3b8");});
    $$('[stroke="var(--surface)"]',clone).forEach(function(l){l.setAttribute("stroke",surf);});
    var vb=(clone.getAttribute("viewBox")||"0 0 900 234").split(/\s+/).map(Number);
    var sc=2,W=vb[2]*sc,Hh=vb[3]*sc;
    var data=new XMLSerializer().serializeToString(clone);
    var img=new Image();
    img.onload=function(){
      try{
        var cv=document.createElement("canvas");cv.width=W;cv.height=Hh;
        var ctx=cv.getContext("2d");ctx.fillStyle=surf;ctx.fillRect(0,0,W,Hh);
        ctx.drawImage(img,0,0,W,Hh);
        var a=document.createElement("a");a.download="СтройРеестр_график_"+today()+".png";
        a.href=cv.toDataURL("image/png");a.click();toast("PNG сохранён","ok");
      }catch(err){toast("Браузер запретил сохранение PNG","bad");}
    };
    img.onerror=function(){toast("Не удалось отрисовать PNG","bad");};
    img.src="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(data)));
  }catch(e){toast("Экспорт PNG недоступен в этом браузере","bad");}
}

function progressRun(){
  var cid=$("#pgC").value,out=$("#pgOut");
  if(!cid){out.innerHTML='<p class="dim">Выберите договор.</p>';return;}
  var its=rows("items").filter(function(i){return String(i.contract)===String(cid);})
    .sort(function(a,b){return num(a.order)-num(b.order);});
  var subs=rows("submissions").filter(function(s){return String(s.contract)===String(cid);});
  var acts=rows("ks2").filter(function(k){return String(k.contract)===String(cid);});
  var actIds=acts.map(function(a){return String(a.id);});
  var ki=rows("ks2items").filter(function(x){return actIds.indexOf(String(x.act))>-1;});
  var H=hues();
  var data=its.map(function(it){
    var pid=String(it.id),total=num(it.qty),price=num(it.price);
    var done=subs.filter(function(s){return String(s.item)===pid&&["Подтверждено","Отредактировано"].indexOf(s.status)>-1;})
      .reduce(function(a,s){return a+num(s.approved);},0);
    var rev=subs.filter(function(s){return String(s.item)===pid&&s.status==="На_проверке";})
      .reduce(function(a,s){return a+num(s.volume);},0);
    var bill=ki.filter(function(x){return String(x.item)===pid;}).reduce(function(a,x){return a+num(x.qty);},0);
    return {id:pid,name:it.name,unit:it.unit,section:it.section,total:total,done:done,rev:rev,
      rest:Math.max(0,total-done-rev),bill:bill,unbill:Math.max(0,total-bill),
      amount:total*price,doneAmt:done*price,billAmt:bill*price};
  });
  var sum=function(k){return data.reduce(function(a,r){return a+r[k];},0);};
  var pct=function(a,b){return b?Math.min(100,a/b*100):0;};
  var f=function(n){return (+n).toFixed(2).replace(/\.00$/,"");};
  var sm=[["Объём по смете",sum("total"),""],["Выполнено",sum("done"),money(sum("doneAmt"))],
    ["На проверке",sum("rev"),""],["Осталось",sum("rest"),""],
    ["Подано КС-2",sum("bill"),money(sum("billAmt"))],["Не подано",sum("unbill"),""]];
  out.innerHTML='<div class="pg-s">'+sm.map(function(x,i){
    return '<div class="pgs" style="--k:'+H[i%8]+'"><span>'+x[0]+"</span><b>"+f(x[1])+"</b><i>"+esc(x[2]||"")+"</i></div>";}).join("")+"</div>"+
    (data.length?data.map(function(p){
      return '<div class="pg-r"><div class="pg-h"><b>'+esc(p.name)+"</b><span>"+esc(p.section||"")+" · "+
        esc(p.unit||"")+" · "+money(p.amount)+"</span></div>"+
        '<div class="pg-l"><label>Выполнение</label><div class="stack">'+
        '<i class="s-ok" style="width:'+pct(p.done,p.total)+'%" title="Подтверждено: '+p.done+'">'+(pct(p.done,p.total)>9?f(p.done):"")+"</i>"+
        '<i class="s-wn" style="width:'+pct(p.rev,p.total)+'%" title="На проверке: '+p.rev+'">'+(pct(p.rev,p.total)>9?f(p.rev):"")+"</i>"+
        '<i class="s-rs" style="width:'+pct(p.rest,p.total)+'%" title="Осталось: '+p.rest+'">'+(pct(p.rest,p.total)>9?f(p.rest):"")+"</i>"+
        "</div><em>"+f(p.done)+" / "+f(p.total)+"</em></div>"+
        '<div class="pg-l"><label>КС-2</label><div class="stack">'+
        '<i class="s-bl" style="width:'+pct(p.bill,p.total)+'%" title="Подано: '+p.bill+'">'+(pct(p.bill,p.total)>9?f(p.bill):"")+"</i>"+
        '<i class="s-rs" style="width:'+pct(p.unbill,p.total)+'%" title="Не подано: '+p.unbill+'">'+(pct(p.unbill,p.total)>9?f(p.unbill):"")+"</i>"+
        "</div><em>"+f(p.bill)+" / "+f(p.total)+"</em></div></div>";}).join("")
      :'<p class="dim">У договора нет позиций сметы. Добавьте их в разделе «Позиции смет».</p>')+
    '<div class="lr"><span><i class="s-ok"></i>подтверждено</span><span><i class="s-wn"></i>на проверке</span>'+
    '<span><i class="s-bl"></i>подано КС-2</span><span><i class="s-rs"></i>остаток</span></div>'+
    (acts.length?'<div class="dst" style="margin-top:16px">Акты КС-2 ('+acts.length+')</div><div class="tw">'+
      '<table class="grid"><thead><tr><th>ID</th><th>Номер</th><th>Дата</th><th>Сумма</th><th>Статус</th></tr></thead><tbody>'+
      acts.map(function(k){
        return '<tr><td class="c-id">'+esc(k.id)+"</td><td>"+esc(k.number)+'</td><td class="dt">'+esc(dstr(k.date))+
          '</td><td><b class="num">'+money(k.sum)+'</b></td><td><span class="chip '+kind(k.status)+'">'+esc(k.status)+"</span></td></tr>";
      }).join("")+"</tbody></table></div>":"");
}

function calendar(){
  var y=S.cal.getFullYear(),mo=S.cal.getMonth();
  var first=new Date(y,mo,1),last=new Date(y,mo+1,0),off=(first.getDay()+6)%7;
  var rem=rows("reminders"),cert=rows("certs"),pres=rows("prescriptions"),now=today();
  var cells=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(function(d){return '<div class="cal-d">'+d+"</div>";}).join("");
  for(var i=0;i<off;i++)cells+='<div class="cc off"></div>';
  var H=hues();
  for(var d=1;d<=last.getDate();d++){
    var ds=y+"-"+pad(mo+1)+"-"+pad(d);
    var ev=[];
    rem.forEach(function(r){if(dstr(r.date)===ds)ev.push({m:"reminders",id:r.id,t:"⏰ "+short(r.object,11)});});
    cert.forEach(function(c){if(dstr(c.expiry)===ds)ev.push({m:"certs",id:c.id,t:"🪪 "+short(c.type,11)});});
    pres.forEach(function(p){if(dstr(p.due)===ds)ev.push({m:"prescriptions",id:p.id,t:"⚠️ "+short(p.number,11)});});
    cells+='<div class="cc'+(ds===now?" now":"")+'"><b>'+d+"</b>"+
      ev.map(function(e,i2){
        return '<button class="ce" style="--k:'+H[i2%8]+'" onclick="Drawer.open(\''+e.m+'\',\''+esc(e.id)+'\')">'+esc(e.t)+"</button>";
      }).join("")+"</div>";
  }
  $("#body").innerHTML='<div class="panel"><div class="cal-h">'+
    '<button class="btn ghost sm" id="calPrev">←</button><h3>'+
    S.cal.toLocaleDateString("ru-RU",{month:"long",year:"numeric"})+"</h3>"+
    '<button class="btn ghost sm" id="calNext">→</button><button class="btn ghost sm" id="calNow">Сегодня</button>'+
    '<button class="btn primary sm" onclick="Form.open(\'reminders\',null)">＋ Напоминание</button></div>'+
    '<div class="cal">'+cells+"</div>"+
    '<div class="lr" style="margin-top:14px"><span>⏰ напоминания</span><span>🪪 допуски</span><span>⚠️ предписания</span></div></div>';
  $("#calPrev").onclick=function(){S.cal.setMonth(S.cal.getMonth()-1);calendar();};
  $("#calNext").onclick=function(){S.cal.setMonth(S.cal.getMonth()+1);calendar();};
  $("#calNow").onclick=function(){S.cal=new Date();calendar();};
}

function trash(){

    "<p>Удалённые записи попадают сюда и могут быть возвращены в реестр.</p></div>";return;}
  $("#body").innerHTML=keys.map(function(k){

    return '<section class="panel"><h3>'+m.i+" "+esc(m.t)+" <em>"+DB.trash[k].length+"</em></h3>"+
      '<div class="tl">'+DB.trash[k].map(function(t){

          '<button class="btn ok sm" onclick="restore(\''+k+'\',\''+esc(t.id)+'\')">↺ Вернуть</button>'+
          '<button class="btn danger sm" onclick="purge(\''+k+'\',\''+esc(t.id)+'\')">✕ Навсегда</button></div>";
      }).join("")+"</div></section>";

function restore(mod,id){
  var arr=DB.trash[mod]||[],rec=null;
  DB.trash[mod]=arr.filter(function(t){if(String(t.id)===String(id)){rec=t;return false;}return true;});
  if(rec){DB[mod].push(rec.data);save();buildNotif();paintNotif();render();
    log("Восстановление",M[mod].t,id);toast("Восстановлено: "+id,"ok");}
}
function purge(mod,id){
  if(!confirm("Удалить "+id+" НАВСЕГДА? Действие необратимо."))return;
  DB.trash[mod]=(DB.trash[mod]||[]).filter(function(t){return String(t.id)!==String(id);});
  save();render();log("Удаление навсегда",M[mod].t,id);toast("Удалено навсегда","ok");
}

function exportCsv(){
  var m=M[S.mod];
  if(!m||m.special){toast("Выберите раздел с таблицей","warn");return;}
  var all=selectRows(m),cols=["id"].concat(colsOf(m));
  var q=function(v){var s=String(v==null?"":v);return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  var csv="\uFEFF"+cols.map(function(c){return c==="id"?"ID":fname(m,c);}).join(";")+"\n";
  all.forEach(function(r){csv+=cols.map(function(c){return q(r[c]);}).join(";")+"\n";});
  try{
    var blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=m.t.replace(/\s+/g,"_")+"_"+today()+".csv";a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
    toast("CSV выгружен: "+all.length+" строк","ok");
  }catch(e){toast("Браузер запретил скачивание файла","bad");}
}

/* ================= клавиши ================= */
function tableKeys(e){
  var m=M[S.mod];if(!m||m.special)return;
  var all=selectRows(m).slice(0,(S.page[m.id]||1)*40);if(!all.length)return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault();
    S.focus=clamp(S.focus+(e.key==="ArrowDown"?1:-1),0,all.length-1);
    list(m);var el=$('[data-i="'+S.focus+'"]');if(el)el.scrollIntoView({block:"nearest"});return;
  }
  if(S.focus<0)return;
  var id=all[S.focus].id;
  if(e.key==="Enter"){e.preventDefault();Drawer.open(m.id,id);}
  if(e.key.toLowerCase()==="e"){e.preventDefault();Form.open(m.id,id);}
  if(e.key===" "){e.preventDefault();
    if(S.sel.has(String(id)))S.sel.delete(String(id));else S.sel.add(String(id));
    bulkBar(m);list(m);}
  if(e.key==="Delete"){e.preventDefault();if(confirm("Удалить "+id+"?"))del(m.id,[id]);}
}
document.addEventListener("keydown",function(e){
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();Pal.open();return;}
  if(e.key==="Escape"){
    if(S.palOpen){Pal.close();return;}
    if(S.notifOpen){Notif.close();return;}
    if($("#modal").classList.contains("on")){Form.close();return;}
    if($("#drawer").classList.contains("on")){Drawer.close();return;}
    if($("#sheet").classList.contains("on")){closeSheet();return;}
    return;
  }
  var typing=["INPUT","TEXTAREA","SELECT"].indexOf(document.activeElement.tagName)>-1;
  if(e.key==="/"&&!typing){e.preventDefault();Pal.open();return;}
  if(!typing&&!S.palOpen&&!$("#modal").classList.contains("on")&&!$("#drawer").classList.contains("on"))tableKeys(e);
});
window.addEventListener("resize",debounce(function(){
  var m=M[S.mod];if(m&&!m.special)list(m);
},220));

/* ================= старт ================= */
DB=load();
if(!DB){DB=seed();save();}
if(!DB.prefs)DB.prefs=JSON.parse(JSON.stringify(PREF_DEF));
DB.prefs.dash=Object.assign({},DASH_DEF,DB.prefs.dash||{});
["views","cols","read","comments","journal","trash"].forEach(function(k){if(!DB[k])DB[k]=k==="comments"||k==="journal"?[]:{};});
MODS.forEach(function(m){if(!m.special&&!DB[m.id])DB[m.id]=[];});
applyDensity();
buildNav();buildSheet();buildNotif();paintNotif();
render();
$("#pInput").addEventListener("input",function(){Pal.search(this.value);});
$("#pInput").addEventListener("keydown",function(e){Pal.key(e);});
$("#pal").addEventListener("mousedown",function(e){if(e.target===this)Pal.close();});
$("#modal").addEventListener("mousedown",function(e){if(e.target===this)Form.close();});
</script>

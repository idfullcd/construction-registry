<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>СтройРеестр · База</title>
<style>
:root {
  --bg: #0f1419;
  --card: #1a2332;
  --card2: #243044;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --border: #2d3748;
  --accent: #ff6b35;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --info: #3b82f6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
.login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #1a2332, #2c5282);
  padding: 20px;
}
.login-card {
  width: 100%;
  max-width: 420px;
  background: var(--card);
  border-radius: 18px;
  padding: 36px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}
.logo { text-align: center; margin-bottom: 24px; }
.logo-icon {
  width: 64px;
  height: 64px;
  margin: 0 auto 12px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--accent), #f7931e);
  font-size: 32px;
}
h1 { font-size: 24px; margin-bottom: 8px; }
.subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
input, select, textarea {
  width: 100%;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
}
.btn {
  padding: 10px 16px;
  border-radius: 8px;
  border: none;
  font-weight: 600;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), #f7931e);
  color: white;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,107,53,0.4); }
.btn-success { background: var(--success); color: white; }
.btn-danger { background: var(--danger); color: white; }
.btn-warning { background: var(--warning); color: white; }
.btn-info { background: var(--info); color: white; }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-ghost:hover { background: var(--card2); }
.btn-sm { padding: 6px 10px; font-size: 12px; }
.btn-full { width: 100%; }
.error { color: var(--danger); font-size: 13px; margin-top: 12px; text-align: center; min-height: 18px; }
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }
.header {
  background: linear-gradient(135deg, #1a2332, #2c5282);
  color: white;
  border-radius: 12px;
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  flex-wrap: wrap;
  gap: 12px;
}
.header-left, .header-right { display: flex; align-items: center; gap: 10px; }
.header-logo {
  width: 42px;
  height: 42px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), #f7931e);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}
.tabs {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px;
  margin-bottom: 16px;
}
.tab {
  white-space: nowrap;
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
  color: var(--muted);
  font-weight: 600;
  font-size: 13px;
}
.tab.active {
  background: linear-gradient(135deg, var(--accent), #f7931e);
  color: white;
}
.tab-content { display: none; }
.tab-content.active { display: block; }
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 16px;
  align-items: center;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 4px solid var(--info);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 14px;
}
.card-header {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.card-title { font-weight: 700; font-size: 15px; }
.card-meta { color: var(--muted); font-size: 12px; line-height: 1.5; }
.badge {
  display: inline-flex;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
}
.badge-info { background: rgba(59,130,246,0.15); color: var(--info); }
.badge-success { background: rgba(16,185,129,0.15); color: var(--success); }
.badge-warning { background: rgba(245,158,11,0.15); color: var(--warning); }
.badge-danger { background: rgba(239,68,68,0.15); color: var(--danger); }
.table-wrap {
  overflow-x: auto;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
}
table { width: 100%; border-collapse: collapse; }
th, td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  font-size: 13px;
}
th {
  background: var(--card2);
  color: var(--muted);
  text-transform: uppercase;
  font-size: 11px;
  font-weight: 700;
}
.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(6px);
  overflow-y: auto;
}
.modal-content {
  width: 92%;
  max-width: 600px;
  margin: 40px auto;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 24px;
}
.close {
  float: right;
  font-size: 28px;
  cursor: pointer;
  color: var(--muted);
}
.close:hover { color: var(--danger); }
.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 4px solid var(--info);
  border-radius: 10px;
  padding: 14px 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  z-index: 2000;
  animation: slideIn 0.3s;
}
.toast.success { border-left-color: var(--success); }
.toast.error { border-left-color: var(--danger); }
.toast.warning { border-left-color: var(--warning); }
@keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.loader { text-align: center; padding: 40px; color: var(--muted); }
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="logo">
      <div class="logo-icon">🏗️</div>
      <h1>СтройРеестр</h1>
      <p class="subtitle">Система управления строительной документацией</p>
    </div>
    <div class="form-group">
      <label for="loginInput">Логин</label>
      <input type="text" id="loginInput" placeholder="admin" autocomplete="username">
    </div>
    <div class="form-group">
      <label for="passwordInput">Пароль</label>
      <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-full" onclick="login()">Войти в систему</button>
    <div id="loginError" class="error"></div>
  </div>
</div>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="mainScreen" class="container" style="display:none;">
  <div class="header">
    <div class="header-left">
      <div class="header-logo">🏗️</div>
      <div>
        <div id="userName" style="font-weight:700;"></div>
        <div id="userRole" style="font-size:12px;opacity:0.8;"></div>
      </div>
    </div>
    <div class="header-right">
      <button class="btn btn-ghost" onclick="loadData()" style="color:white;">🔄 Обновить</button>
      <button class="btn btn-danger" onclick="logout()">Выйти</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="users" onclick="switchTab('users')">👥 Пользователи</div>
    <div class="tab" data-tab="journal" onclick="switchTab('journal')">📜 Журнал</div>
    <div class="tab" data-tab="history" onclick="switchTab('history')">🕘 История</div>
    <div class="tab" data-tab="trash" onclick="switchTab('trash')">🗑️ Корзина</div>
    <div class="tab" data-tab="settings" onclick="switchTab('settings')">⚙️ Настройки</div>
  </div>

  <!-- ПОЛЬЗОВАТЕЛИ -->
  <div id="tab-users" class="tab-content active">
    <div class="controls">
      <button class="btn btn-primary" onclick="openUserModal()">➕ Новый пользователь</button>
      <input type="text" id="userSearch" placeholder="🔍 Поиск..." oninput="renderUsers()" style="flex:1;min-width:200px;">
    </div>
    <div id="usersList"></div>
  </div>

  <!-- ЖУРНАЛ -->
  <div id="tab-journal" class="tab-content">
    <div class="controls">
      <button class="btn btn-success" onclick="loadData()">🔄 Обновить</button>
    </div>
    <div id="journalList"></div>
  </div>

  <!-- ИСТОРИЯ -->
  <div id="tab-history" class="tab-content">
    <div class="controls">
      <button class="btn btn-success" onclick="loadData()">🔄 Обновить</button>
    </div>
    <div id="historyList"></div>
  </div>

  <!-- КОРЗИНА -->
  <div id="tab-trash" class="tab-content">
    <div class="controls">
      <button class="btn btn-success" onclick="loadData()">🔄 Обновить</button>
    </div>
    <div id="trashList"></div>
  </div>

  <!-- НАСТРОЙКИ -->
  <div id="tab-settings" class="tab-content">
    <div class="card">
      <h3>💾 Резервные копии</h3>
      <p class="card-meta" style="margin:10px 0;">Создайте резервную копию таблицы прямо сейчас</p>
      <button class="btn btn-primary" onclick="createBackup()">Создать копию</button>
    </div>
    <div class="card">
      <h3>⏱ Автоматические бэкапы</h3>
      <p class="card-meta" style="margin:10px 0;">Ежедневное создание копии в 23:00. Хранение 30 дней.</p>
      <button class="btn btn-info" onclick="installTriggers()">Установить триггеры</button>
    </div>
    <div class="card">
      <h3>📧 Email-уведомления</h3>
      <div class="form-group" style="margin-top:10px;">
        <label>Имя отправителя</label>
        <input type="text" id="setSender" value="СтройРеестр">
      </div>
      <button class="btn btn-primary" onclick="saveSettings()">Сохранить настройки</button>
    </div>
  </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО -->
<div id="userModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <div id="modalBody"></div>
  </div>
</div>

<!-- ТОСТЫ -->
<div id="toasts"></div>

<script src="app.js"></script>
</body>
</html>

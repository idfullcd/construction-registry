<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16202f">
<title>СтройРеестр · управление строительной документацией</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff6b35'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle'%3E%F0%9F%8F%97%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="brand">
      <div class="brand-ico">🏗️</div>
      <h1>СтройРеестр</h1>
      <p>Договоры · Исполнительная · КС-2 · Охрана ОКН · Надзор</p>
    </div>
    <div class="fg"><label for="loginInput">Логин</label><input id="loginInput" type="text" autocomplete="username" placeholder="admin"></div>
    <div class="fg"><label for="passwordInput">Пароль</label><input id="passwordInput" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn primary btn-full" id="loginBtn" onclick="login()">Войти в систему</button>
    <div class="error" id="loginError"></div>
    <div class="login-meta">Сессия 6 часов · пароли SHA-256 · 33 разделов<br>Первый вход: <b>admin</b> / <b>admin123</b></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <div class="top-logo">🏗️</div>
    <div class="ava" id="uAvatar">—</div>
    <div class="top-user"><b id="uName">—</b><span id="uRole">—</span></div>
    <span class="net ok" id="netBadge">онлайн</span>
    <span class="sync">обновлено <b id="syncTime">—</b></span>
    <div class="grow"></div>
    <button class="btn" onclick="exportCurrent('xls')">⤓ Excel</button>
    <button class="btn" onclick="loadData()">⟳</button>
    <button class="btn" onclick="toggleTheme()" title="Светлая / тёмная тема">🌓</button>
    <button class="btn" onclick="logout()">Выйти</button>
  </header>
  <nav id="navGroups"></nav>
  <main id="modHost"></main>
</div>

<div id="scrim" onclick="closeDrawer()"></div>
<aside id="drawer" aria-label="Карточка записи">
  <div class="drawer-head">
    <div id="drawerTitle" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0"></div>
    <button class="btn ghost sm" onclick="closeDrawer()">✕</button>
  </div>
  <div id="drawerBody"></div>
  <div id="drawerFoot"></div>
</aside>

<div id="modal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <div class="modal-head"><h3 id="modalTitle">—</h3><button class="modal-x" onclick="closeModal()">×</button></div>
    <div id="modalBody"></div>
    <div id="modalFoot"></div>
  </div>
</div>

<nav id="mnav">
  <button class="mnav-item on" data-mod="contracts" onclick="setModule('contracts')"><span>📋</span>Договоры</button>
  <button class="mnav-item" data-mod="submissions" onclick="setModule('submissions')"><span>📝</span>Подачи</button>
  <button class="mnav-item" data-mod="documents" onclick="setModule('documents')"><span>📄</span>Файлы</button>
  <button class="mnav-item" data-mod="tasks" onclick="setModule('tasks')"><span>📨</span>Задания</button>
  <button class="mnav-item" onclick="openMore()"><span>☰</span>Ещё</button>
</nav>
<button id="fab" onclick="fabAction()" aria-label="Создать">＋</button>

<div id="moreSheet">
  <div class="more-bar"></div>
  <div class="more-head"><h3>Все разделы</h3><button class="btn ghost sm" onclick="closeMore()">Закрыть</button></div>
  <div id="moreBody"></div>
</div>

<div id="toasts"></div>

<script src="config.js"></script>
<script src="core.js"></script>
<script src="modules.js"></script>
<script src="admin.js"></script>
<script>
function fabAction(){
  const m=MOD[S.mod];
  if(m&&m.sheet&&can(m.id,'create')) openForm(m,null);
  else{setModule('contracts');openForm(MOD.contracts,null);}
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СтройРеестр — Вход</title>
<style>
  body{font-family:'Segoe UI',Tahoma,sans-serif;max-width:860px;margin:30px auto;padding:16px;background:#f4f6f8;color:#333}
  .hidden{display:none!important}
  .card{background:#fff;padding:28px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
  label{display:block;margin-bottom:5px;font-weight:600}
  input,select{width:100%;padding:10px;box-sizing:border-box;border:1px solid #ccc;border-radius:6px;font-size:14px}
  .form-group{margin-bottom:14px}
  button{padding:10px 18px;cursor:pointer;background:#007bff;color:#fff;border:0;border-radius:6px;font-size:15px}
  button:hover{background:#0056b3}
  button:disabled{background:#bbb;cursor:not-allowed}
  .btn-danger{background:#dc3545;padding:6px 12px;font-size:14px}
  .btn-danger:hover{background:#c82333}
  .error{color:#dc3545;font-size:14px}
  .success{color:#28a745;font-size:14px}
  table{width:100%;border-collapse:collapse;margin-top:16px}
  th,td{border-bottom:1px solid #eee;padding:10px;text-align:left}
  th{background:#f8f9fa}
  .badge{display:inline-block;padding:3px 8px;border-radius:4px;font-size:12px;font-weight:700;text-transform:uppercase}
  .role-admin{background:#ffebee;color:#c62828}
  .role-moderator{background:#fff3e0;color:#ef6c00}
  .role-user{background:#e3f2fd;color:#1565c0}
  #debug{margin-top:18px;font-size:12px;color:#888;word-break:break-all;border-top:1px dashed #ddd;padding-top:10px}
</style>
</head>
<body>
<div class="card">
  <h1>🏗️ СтройРеестр</h1>

  <div id="auth-section">
    <h2>Вход в систему</h2>
    <div class="form-group"><label>Имя пользователя</label><input id="login-username" autocomplete="username"></div>
    <div class="form-group"><label>Пароль</label><input id="login-password" type="password" autocomplete="current-password"></div>
    <button id="btn-login">Войти</button>
    <p>Нет аккаунта? <a href="#" id="link-reg">Зарегистрироваться</a></p>
    <p id="login-message" class="error"></p>
  </div>

  <div id="register-section" class="hidden">
    <h2>Регистрация</h2>
    <div class="form-group"><label>Придумайте имя пользователя</label><input id="reg-username" autocomplete="username"></div>
    <div class="form-group"><label>Придумайте пароль</label><input id="reg-password" type="password" autocomplete="new-password"></div>
    <button id="btn-reg">Зарегистрироваться</button>
    <p>Уже есть аккаунт? <a href="#" id="link-login">Войти</a></p>
    <p id="reg-message" class="error"></p>
  </div>

  <div id="main-section" class="hidden">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>Привет, <span id="current-user"></span></h2>
      <button id="btn-logout" class="btn-danger">Выйти</button>
    </div>
    <p>Ваша роль: <span id="current-role" class="badge"></span></p>

    <div id="admin-panel" class="hidden">
      <hr><h3>⚙️ Панель администратора</h3>
      <button id="btn-refresh">🔄 Обновить список</button>
      <table>
        <thead><tr><th>Пользователь</th><th>Роль</th><th>Действия</th></tr></thead>
        <tbody id="users-tbody"></tbody>
      </table>
      <p id="admin-message" class="error"></p>
    </div>
  </div>

  <div id="debug"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygeGjQ-1vDd1xuM4cfITXpSJ3sI_nD5ux4dYCpAJquppwPjOaaK0HSwuIVVN8BODjjXA/exec";
const BUILD = "FINAL-2026-11-22";

const $ = id => document.getElementById(id);
let currentUser = null;

window.addEventListener('load', () => {
  const dbg = $('debug');
  if (dbg) dbg.innerHTML = 'Сборка: <b>' + BUILD + '</b><br>API: ' + SCRIPT_URL;
  const saved = localStorage.getItem('currentUser');
  if (saved) {
    try { currentUser = JSON.parse(saved); renderMain(); }
    catch (e) { localStorage.removeItem('currentUser'); }
  }
});

async function api(action, data = {}) {
  const payload = { action, ...data };
  const url = SCRIPT_URL + '?t=' + Date.now(); // Защита от кэша
  
  try {
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // Предотвращает CORS preflight
      body: JSON.stringify(payload),
      redirect: 'follow'
    });
    const text = await response.text();
    try {
      return JSON.parse(text);
    } catch (e) {
      console.error("Сервер вернул не JSON:", text);
      return { success: false, message: 'Ошибка сервера Google. Проверьте, что в Apps Script выбрано "Выполнять от имени: Я" и "Доступ: Все". Ответ: ' + text.substring(0, 150) };
    }
  } catch (error) {
    return { success: false, message: 'Ошибка сети: ' + error.message };
  }
}

function msg(id, text, ok = false) {
  const el = $(id);
  if (!el) return;
  el.textContent = text;
  el.className = ok ? 'success' : 'error';
}

function show(section) {
  ['auth-section', 'register-section', 'main-section'].forEach(s => {
    const el = $(s); if (el) el.classList.add('hidden');
  });
  $(section).classList.remove('hidden');
}

document.addEventListener('DOMContentLoaded', () => {
  $('link-reg').onclick   = e => { e.preventDefault(); msg('login-message', ''); show('register-section'); };
  $('link-login').onclick = e => { e.preventDefault(); msg('reg-message', '');   show('auth-section'); };
  $('btn-login').onclick  = login;
  $('btn-reg').onclick    = register;
  $('btn-logout').onclick = logout;
  $('btn-refresh').onclick = loadUsers;

  $('users-tbody').addEventListener('change', async e => {
    const el = e.target;
    if (el.dataset.act !== 'role') return;
    const r = await api('changeRole', { targetUsername: el.dataset.user, newRole: el.value, adminUsername: currentUser.username });
    if (!r.success) alert(r.message); else loadUsers();
  });

  $('users-tbody').addEventListener('click', async e => {
    const el = e.target;
    if (el.dataset.act !== 'del') return;
    if (!confirm('Безвозвратно удалить пользователя "' + el.dataset.user + '"?')) return;
    const r = await api('deleteUser', { targetUsername: el.dataset.user, adminUsername: currentUser.username });
    if (!r.success) alert(r.message); else loadUsers();
  });
});

async function register() {
  const username = $('reg-username').value.trim();
  const password = $('reg-password').value;
  if (!username || !password) return msg('reg-message', 'Заполните все поля');
  msg('reg-message', 'Регистрация…', true);
  const r = await api('register', { username, password });
  if (r.success) {
    msg('reg-message', r.message, true);
    setTimeout(() => { show('auth-section'); msg('login-message', 'Теперь войдите', true); }, 1200);
  } else msg('reg-message', r.message);
}

async function login() {
  const username = $('login-username').value.trim();
  const password = $('login-password').value;
  if (!username || !password) return msg('login-message', 'Заполните все поля');
  msg('login-message', 'Вход…', true);
  const r = await api('login', { username, password });
  if (r.success) {
    currentUser = r.user;
    localStorage.setItem('currentUser', JSON.stringify(currentUser));
    msg('login-message', '');
    renderMain();
  } else msg('login-message', r.message);
}

function logout() {
  currentUser = null;
  localStorage.removeItem('currentUser');
  $('login-password').value = '';
  show('auth-section');
}

function renderMain() {
  show('main-section');
  $('current-user').textContent = currentUser.username;
  $('current-role').textContent = currentUser.role;
  $('current-role').className = 'badge role-' + currentUser.role;
  if (currentUser.role === 'admin') {
    $('admin-panel').classList.remove('hidden');
    loadUsers();
  } else {
    $('admin-panel').classList.add('hidden');
  }
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function loadUsers() {
  const tb = $('users-tbody');
  tb.innerHTML = '<tr><td colspan="3">Загрузка…</td></tr>';
  const r = await api('getUsers', { adminUsername: currentUser.username });
  if (!r.success) { tb.innerHTML = ''; return msg('admin-message', r.message); }
  msg('admin-message', '');
  tb.innerHTML = r.users.map(u => {
    const self = u.username === currentUser.username;
    const opt = (v, l) => `<option value="${v}" ${u.role === v ? 'selected' : ''}>${l}</option>`;
    return `<tr>
      <td>${esc(u.username)}${self ? ' <i>(вы)</i>' : ''}</td>
      <td><span class="badge role-${esc(u.role)}">${esc(u.role)}</span></td>
      <td>
        <select data-act="role" data-user="${esc(u.username)}" ${self ? 'disabled' : ''} style="width:auto;display:inline-block;padding:6px">
          ${opt('user', 'user')}${opt('moderator', 'moderator')}${opt('admin', 'admin')}
        </select>
        <button class="btn-danger" data-act="del" data-user="${esc(u.username)}" ${self ? 'disabled' : ''}>Удалить</button>
      </td></tr>`;
  }).join('');
}
</script>
</body>
</html>
